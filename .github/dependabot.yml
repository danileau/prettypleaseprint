# Dependabot.
#
# Discipline: never blind-merge a major. A major rides its own pull request,
# gets its release notes read and a local test pass. Minor and patch are
# grouped weekly to keep the noise down; they still go through CI.
version: 2
updates:
  # `@swc/helpers` is a devDependency that nothing here imports. It is there
  # for the lockfile: next pins 0.5.15, @swc/core (under next-intl) has an
  # optional peer on >=0.5.17, and the npm Dependabot runs (12) leaves that
  # nested optional entry out while the npm 10 bundled with Node 22 refuses
  # to `npm ci` without it ("Missing: @swc/helpers@0.5.24 from lock file",
  # #125, #127, #131). Declared, both write the same tree, with no npm pin to
  # cost the cooldown (npm 10 has no --min-release-age). next keeps its own
  # 0.5.15. Remove it once CI and the Dockerfile are on an npm that accepts
  # such a lockfile (11 and 12 do).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next 16 changed caching defaults and removed APIs. It needs a
      # deliberate migration with a visual pass over every screen, not a
      # dependabot bump. 15.x minor/patch still flow through.
      - dependency-name: next
        update-types: [version-update:semver-major]
      # Prisma 7 moves the generated client's location and goes ESM-only.
      # Deliberate migration, together with the Dockerfile's copy paths.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      # @types/node majors track the Node runtime major. This app runs Node 22
      # (Dockerfile and ci.yml), so the types stay on 22 — types ahead of the
      # runtime describe APIs that typecheck clean and then throw. Bump only
      # together with the Node version in both places.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Actions are low-risk infrastructure; their majors rarely change
      # behaviour. One grouped PR rather than one per action — the
      # majors-ride-alone rule is for runtime dependencies.
      actions-all:
        patterns: ["*"]
