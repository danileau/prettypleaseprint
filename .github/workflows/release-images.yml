# Release images — every merge to main publishes deployable images to ghcr.io.
#
# This is what makes the NAS a consumer rather than a builder: it never needs
# the source tree or a toolchain, and what runs there is byte-for-byte what CI
# tested. Deploying stays a human action — nothing here reaches into TrueNAS.
#
# Tags per image: the 7-char commit SHA, and a moving `latest`. Pin PPP_TAG to
# a SHA on the NAS, because that is also how you roll back.
#
# Images are signed with cosign keyless (GitHub OIDC, logged to Rekor). The
# signature pins the identity of THIS workflow on THIS repo, which protects
# the registry-to-NAS link against a tampered or foreign image. It does not
# protect against a compromised GitHub account — that would sign legitimately.
#
# One-time setup on the NAS:
#   docker login ghcr.io -u <you> -p <PAT with read:packages>
#   .env.docker:  PPP_REGISTRY=ghcr.io/<you>   PPP_TAG=<sha>
#
# workflow_dispatch exists because base-layer CVEs land with no commit to
# trigger on: same main, fresh `apk upgrade`, republished.
name: Release images

on:
  push:
    branches: [main]
    # The daily traffic snapshot writes only here, and republishing images for
    # a row of numbers helps nobody.
    paths-ignore:
      - "docs/traffic/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ppp-app
            target: runner
          - name: ppp-migrate
            target: migrator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          # No registry cache on the base layers: an `apk upgrade` has to
          # really re-run, or a CVE fixed upstream shows up as a stale replay.
          provenance: true
          sbom: true

      - name: Sign the image
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}"

      # Scan what was actually published, not the repo. A base image can carry
      # a CVE that no filesystem scan of this checkout would ever see.
      - name: Trivy scan of the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.sha.outputs.short }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
