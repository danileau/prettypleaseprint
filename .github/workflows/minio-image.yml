# MinIO image — built from source, because nobody publishes one any more.
#
# MinIO withdrew its community distribution: the Docker Hub repository answers
# 404, quay.io refuses an anonymous pull, and dl.min.io answers 410 for the
# server binary and for mc on every architecture. Upstream's own release
# Dockerfile downloads those binaries, so it is dead too. The source is still
# public and AGPL-3.0, so this compiles it.
#
# This is not on every push to main. The image depends on two pinned upstream
# releases and a Dockerfile, none of which move when application code does, and
# republishing an object store because a React component changed is how a
# routine deploy turns into an unplanned storage upgrade. It runs when its own
# files change, or when somebody asks for it.
#
# The tag is the MinIO release itself. There is deliberately no `latest`: a
# floating tag on an object store is an on-disk format change waiting for a
# routine pull, which is the same reasoning the compose files carry.
name: MinIO image

on:
  push:
    branches: [main]
    paths:
      - "docker/minio/**"
      - ".github/workflows/minio-image.yml"
  workflow_dispatch:
    inputs:
      minio_release:
        description: "MinIO server release tag to build"
        required: false
        default: "RELEASE.2025-09-07T16-13-09Z"
      mc_release:
        description: "mc client release tag to build"
        required: false
        default: "RELEASE.2025-08-13T08-35-41Z"

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

concurrency:
  group: minio-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Defaults live in the Dockerfile's ARGs so a plain `docker build` of the
      # directory produces the same thing this workflow does. A dispatch can
      # override them; a push uses whatever the Dockerfile pins.
      - name: Which releases
        id: rel
        run: |
          set -euo pipefail
          df=docker/minio/Dockerfile
          minio="${{ inputs.minio_release }}"
          mc="${{ inputs.mc_release }}"
          [ -n "$minio" ] || minio="$(sed -n 's/^ARG MINIO_TAG=//p' "$df" | head -1)"
          [ -n "$mc" ]    || mc="$(sed -n 's/^ARG MC_TAG=//p' "$df" | head -1)"
          echo "minio=$minio" >> "$GITHUB_OUTPUT"
          echo "mc=$mc"       >> "$GITHUB_OUTPUT"
          echo "building minio $minio with mc $mc"

      # No QEMU step, on purpose. The build stage runs on the native
      # architecture and cross-compiles (Go is good at this; emulating a Go
      # build of MinIO is minutes against seconds), and the runtime stage
      # executes nothing at all — every instruction in it is a file copy, which
      # is why `chmod` is done with COPY --chmod rather than RUN. Add QEMU only
      # if a RUN ever appears in that final stage, and think about why first.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MINIO_TAG=${{ steps.rel.outputs.minio }}
            MC_TAG=${{ steps.rel.outputs.mc }}
          # `-src` so this never lands on the tag the mirror was published
          # under. It did once: the compose files pinned tag@digest, this
          # workflow pushed a different image to the same tag, and the pin's
          # two halves silently stopped agreeing. A build must not move a tag
          # something else is using as provenance.
          tags: ghcr.io/${{ github.repository_owner }}/minio:${{ steps.rel.outputs.minio }}-src
          provenance: true
          sbom: true

      - name: Sign the image
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/minio@${{ steps.push.outputs.digest }}"

      # Scan what was published. The runtime base is Red Hat's ubi-micro and
      # carries whatever it carries; a filesystem scan of this repo would never
      # see it.
      - name: Trivy scan of the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/minio:${{ steps.rel.outputs.minio }}-src
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # The digest is what the compose files pin, so print it where a human
      # updating them can copy it rather than going digging in the registry.
      - name: The line to paste into the compose files
        run: |
          echo "image: ghcr.io/${{ github.repository_owner }}/minio@${{ steps.push.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"
