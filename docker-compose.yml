services:
  db:
    image: postgres:17-alpine
    container_name: ppp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppp
      POSTGRES_PASSWORD: dev-only-not-a-secret
      POSTGRES_DB: ppp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppp -d ppp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Credentials here are literally named 'dev-only-not-a-secret' so that a
  # copy-paste into a real deployment is impossible to miss. The production
  # stack (docker-compose.prod.yml) refuses to start without real ones.
  #
  # There is no object store any more. Model files are written straight to
  # ./data/uploads by `npm run dev`, which needs no container at all — see
  # MODELS_ROOT in .env.example and src/lib/storage.ts.

  # Catches every outbound email in dev. Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ppp-mailpit
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
