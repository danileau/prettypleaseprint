# Local overlay. Publishes what the plain production stack deliberately does
# not, so the app is reachable in a browser and the verification suites on the
# host can inspect what the containerised app actually wrote.
#
#   docker compose --env-file .env.docker \
#     -f docker-compose.prod.yml -f docker-compose.test.yml \
#     --profile mailcatcher up -d --build
#
# Never apply this on a deployed host. Postgres is an internal service, and
# the app should only ever be reached through the proxy.
services:
  app:
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Importing from a link is off unless a deployment asks for it. The
      # suites ask for it, and point the importer at the stand-in below rather
      # than at the real Printables — see scripts/stubs/printables-stub.mjs.
      IMPORT_SOURCES: printables
      IMPORT_PRINTABLES_BASE: http://printables-stub:4010
      # Both ways in at once, so the suites that sign in with a password keep
      # working and `verify:sso` has a provider to sign in through: the
      # stand-in below. It has no certificate — it is a container on this
      # private network — which is the one thing OIDC_ALLOW_INSECURE_ISSUER is
      # for. Never set that on a deployed host.
      AUTH_METHODS: local,oidc
      OIDC_ISSUER: http://oidc-stub:4020
      OIDC_ALLOW_INSECURE_ISSUER: "true"
      OIDC_CLIENT_ID: ppp
      OIDC_CLIENT_SECRET: ppp-stub-secret
      OIDC_NAME: the office login
    depends_on:
      # Better Auth reads the provider's discovery document when it first
      # starts. If the provider is not up yet it leaves single sign-on off
      # until a restart — true of a real provider too, and written down in
      # docs/deployment.md.
      oidc-stub:
        condition: service_started
  db:
    ports:
      - "5432:5432"
  mailpit:
    ports:
      # 8025 is the web UI where invitation and reset links show up;
      # 1025 is SMTP, which the host-side suites post to directly.
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "1025:1025"
  # A stand-in for Printables, so `verify:import` can make the far end
  # misbehave. The Dockerfile's own base image, running one file with no
  # dependencies. Published so the suite can read its request counts and assert
  # that a refused link was never connected to at all.
  printables-stub:
    image: node:22-alpine
    container_name: ppp-printables-stub
    command: ["node", "/stub/printables-stub.mjs"]
    environment:
      STUB_ORIGIN: http://printables-stub:4010
      STUB_ELSEWHERE_ORIGIN: http://printables-stub:4011
    volumes:
      - ./scripts/stubs/printables-stub.mjs:/stub/printables-stub.mjs:ro
    ports:
      - "${PRINTABLES_STUB_PORT:-4010}:4010"
  # A stand-in OpenID Connect provider, for `verify:sso` — one that can be told
  # who is signing in, and told to lie. See scripts/stubs/oidc-stub.mjs.
  # Published so the suite can follow the browser's half of the redirect.
  oidc-stub:
    image: node:22-alpine
    container_name: ppp-oidc-stub
    command: ["node", "/stub/oidc-stub.mjs"]
    environment:
      STUB_ISSUER: http://oidc-stub:4020
      STUB_REDIRECT_URIS: ${APP_URL:-http://localhost:3000}/api/auth/callback/oidc
    volumes:
      - ./scripts/stubs/oidc-stub.mjs:/stub/oidc-stub.mjs:ro
    ports:
      - "${OIDC_STUB_PORT:-4020}:4020"
